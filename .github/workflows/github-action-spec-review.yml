name: Agent Spec Review

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.ai-standards/**'

jobs:
  spec-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessario para gerar o git diff corretamente
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: pip install google-genai
        
      - name: Run Agent Spec Review
        env:
          # O projeto consumidor devera configurar este secret no seu repo Github
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          # O script consumira as regras locais disponiveis no .ai-standards do projeto
          python .ai-standards/scripts/ci/run-spec-review.py
